# docker-compose.yml
services:
  # --- 1. アプリケーションサーバー (Streamlit/Flet) ---
  app:
    build: .
    container_name: legal_app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8501:8501"
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=legal_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=7034
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    depends_on:
      - db
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    restart: always

  # --- 2. データベースサーバー (PostgreSQL) ---
  db:
    image: postgres:15
    container_name: legal_system_db
    environment:
      - POSTGRES_DB=legal_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=7034
    ports:
      - "5432:5432"
    volumes:
      # ★重複していた volumes 記述を1つに整理
      - postgres_data:/var/lib/postgresql/data
    restart: always

# データの永続化領域定義
volumes:
  postgres_data: